<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LumiTrail</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
#map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; }

/* Control panel */
#panel {
  position: absolute; top: 10px; right: 10px; z-index: 1000;
  background: white; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  padding: 12px; max-width: 320px; max-height: 90vh; overflow-y: auto;
  font-size: 13px;
}
#panel h2 { font-size: 15px; margin-bottom: 8px; }
#panel .stats { color: #666; margin-bottom: 10px; font-size: 12px; }
#panel label { display: block; margin: 2px 0; cursor: pointer; }
#panel label:hover { background: #f0f0f0; border-radius: 3px; }
#panel input[type=checkbox] { margin-right: 6px; }
.section { margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
.section-title { font-weight: 600; margin-bottom: 4px; font-size: 13px; cursor: pointer; }
.section-title:hover { color: #0066cc; }
.custom-track-list { max-height: 200px; overflow-y: auto; margin-bottom: 6px; }
.custom-track-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 3px 4px; font-size: 12px; cursor: pointer; border-radius: 3px;
}
.custom-track-item:hover { background: #f0f0f0; }
.custom-track-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.custom-track-item .remove-btn {
  cursor: pointer; color: #999; font-size: 13px; padding: 0 4px; flex-shrink: 0;
}
.custom-track-item .remove-btn:hover { color: #cc3333; }

/* Toggle buttons */
.toggle-row { display: flex; gap: 6px; margin-bottom: 8px; }
.toggle-btn {
  flex: 1; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px;
  background: #f8f8f8; cursor: pointer; text-align: center; font-size: 12px;
  transition: all 0.15s;
}
.toggle-btn.active { background: #0066cc; color: white; border-color: #0066cc; }
.toggle-btn:hover { border-color: #999; }

/* Photo popup */
.photo-popup { text-align: center; }
.photo-popup img { max-width: 280px; max-height: 200px; border-radius: 4px; }
.photo-popup .meta { font-size: 11px; color: #666; margin-top: 4px; }

/* Track popup */
.track-popup .name { font-weight: 600; margin-bottom: 4px; }
.track-popup .meta { font-size: 11px; color: #666; }
.track-popup .copy-path { display: inline-block; margin-top: 6px; cursor: pointer; font-size: 11px; color: #1a73e8; text-decoration: none; }
.track-popup .copy-path:hover { text-decoration: underline; }
.track-popup .copy-ok { color: #2e7d32; font-size: 11px; margin-left: 4px; }

/* Photo gallery strip */
#gallery {
  display: none; position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(20,20,20,0.92); backdrop-filter: blur(8px);
  border-top: 1px solid #444;
}
#gallery-close {
  position: absolute; top: 6px; right: 12px; color: #aaa; font-size: 20px;
  cursor: pointer; z-index: 1001; background: none; border: none; line-height: 1;
}
#gallery-close:hover { color: white; }
#gallery-main {
  display: flex; align-items: center; justify-content: center;
  padding: 8px 40px; gap: 8px; min-height: 160px;
}
#gallery-main img {
  max-height: 220px; max-width: 50vw; border-radius: 6px;
  object-fit: contain; cursor: zoom-in;
}
#gallery-meta {
  color: #ccc; font-size: 12px; text-align: center; padding: 0 0 4px;
}
.gallery-arrow {
  background: rgba(255,255,255,0.15); border: none; color: white;
  font-size: 28px; width: 40px; height: 60px; cursor: pointer;
  border-radius: 6px; flex-shrink: 0; transition: background 0.15s;
}
.gallery-arrow:hover { background: rgba(255,255,255,0.3); }
.gallery-arrow:disabled { opacity: 0.2; cursor: default; }
#gallery-strip {
  display: flex; gap: 4px; padding: 4px 12px 8px; overflow-x: auto;
  justify-content: center;
}
#gallery-strip img {
  width: 48px; height: 48px; object-fit: cover; border-radius: 4px;
  cursor: pointer; border: 2px solid transparent; opacity: 0.6;
  transition: all 0.15s; flex-shrink: 0;
}
#gallery-strip img.active { border-color: #4a90d9; opacity: 1; }
#gallery-strip img:hover { opacity: 1; }

/* Fullscreen lightbox */
#lightbox {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 2000; background: rgba(0,0,0,0.95);
  align-items: center; justify-content: center; flex-direction: column;
  cursor: zoom-out;
}
#lightbox.open { display: flex; }
#lightbox img {
  max-width: 95vw; max-height: 80vh; object-fit: contain; border-radius: 4px;
  cursor: default; width: auto; height: 80vh;
}
#lightbox-meta {
  color: #aaa; font-size: 13px; margin-top: 10px; text-align: center;
}
#lightbox .gallery-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  height: 80px; width: 50px; font-size: 36px;
}
#lightbox #lb-prev { left: 12px; }
#lightbox #lb-next { right: 12px; }
#lightbox-close {
  position: absolute; top: 12px; right: 18px; color: #aaa; font-size: 32px;
  cursor: pointer; background: none; border: none; line-height: 1;
}
#lightbox-close:hover { color: white; }

/* Loading */
#loading {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 2000; background: white; padding: 20px 30px; border-radius: 8px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.3); font-size: 14px;
}

/* Photo marker */
.photo-marker {
  width: 36px; height: 36px; border-radius: 4px; border: 2px solid white;
  box-shadow: 0 1px 4px rgba(0,0,0,0.4); background-size: cover;
  background-position: center;
}

/* Cluster custom */
.marker-cluster-small { background-color: rgba(0, 102, 204, 0.3); }
.marker-cluster-small div { background-color: rgba(0, 102, 204, 0.6); }
.marker-cluster-medium { background-color: rgba(204, 102, 0, 0.3); }
.marker-cluster-medium div { background-color: rgba(204, 102, 0, 0.6); }
.marker-cluster-large { background-color: rgba(204, 0, 0, 0.3); }
.marker-cluster-large div { background-color: rgba(204, 0, 0, 0.6); }

/* Date range slider */
.date-range-section { margin-bottom: 10px; }
.date-range-labels { display: flex; justify-content: space-between; font-size: 11px; color: #666; margin-bottom: 4px; }
.date-range-slider { position: relative; height: 24px; }
.date-range-slider input[type=range] {
  position: absolute; width: 100%; pointer-events: none; appearance: none;
  background: transparent; z-index: 2;
}
.date-range-slider input[type=range]::-webkit-slider-thumb {
  pointer-events: auto; appearance: none; width: 18px; height: 18px;
  border-radius: 50%; background: #0066cc; border: 2px solid white;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3); cursor: pointer;
}
.date-range-slider input[type=range]::-moz-range-thumb {
  pointer-events: auto; width: 18px; height: 18px; border-radius: 50%;
  background: #0066cc; border: 2px solid white;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3); cursor: pointer;
}
.date-range-slider .track-bg {
  position: absolute; top: 8px; left: 9px; right: 9px; height: 4px;
  background: #ddd; border-radius: 2px; z-index: 1; pointer-events: none;
}
.date-range-slider .track-fill {
  position: absolute; top: 8px; height: 4px; background: #0066cc;
  border-radius: 2px; z-index: 1; pointer-events: none;
}

/* Tree view */
.tree-container { max-height: 500px; overflow-y: auto; }
.tree-node { position: relative; }
.tree-folder { display: flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 3px; cursor: pointer; user-select: none; }
.tree-folder:hover { background: #f0f0f0; }
.tree-folder.open > .folder-toggle::before { content: '▼'; }
.tree-folder:not(.open) > .folder-toggle::before { content: '▶'; }
.folder-toggle { width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #666; flex-shrink: 0; }
.folder-checkbox { margin: 0; accent-color: #0066cc; }
.folder-icon { font-size: 12px; }
.folder-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.folder-count { font-size: 10px; color: #888; padding: 1px 4px; background: #eee; border-radius: 3px; }

.tree-file { display: flex; align-items: center; gap: 4px; padding: 2px 4px 2px 20px; border-radius: 3px; cursor: pointer; user-select: none; font-size: 11px; }
.tree-file:hover { background: #f0f0f0; }
.file-checkbox { margin: 0; accent-color: #0066cc; }
.file-icon { font-size: 11px; width: 14px; text-align: center; }
.file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-date { font-size: 10px; color: #888; flex-shrink: 0; }

	.tree-children { padding-left: 16px; border-left: 1px solid #eee; margin-left: 10px; }
	.tree-children.collapsed { display: none; }

	/* Tree action buttons */
.tree-actions { display: flex; gap: 4px; margin-bottom: 8px; }
.tree-btn {
  flex: 1; padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px;
  background: #f8f8f8; cursor: pointer; font-size: 11px; text-align: center;
}
.tree-btn:hover { border-color: #999; background: #eee; }
.tree-btn:active { background: #ddd; }

/* Scrollbar styling */
.tree-container::-webkit-scrollbar { width: 6px; }
.tree-container::-webkit-scrollbar-track { background: transparent; }
.tree-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
.tree-container::-webkit-scrollbar-thumb:hover { background: #aaa; }
</style>
</head>
<body>

<div id="loading">Lade Kartendaten...</div>
<div id="map"></div>
<div id="gallery">
  <button id="gallery-close" onclick="closeGallery()">&times;</button>
  <div id="gallery-main">
    <button class="gallery-arrow" id="gallery-prev" onclick="galleryNav(-1)">&#8249;</button>
    <img id="gallery-img" src="">
    <button class="gallery-arrow" id="gallery-next" onclick="galleryNav(1)">&#8250;</button>
  </div>
  <div id="gallery-meta"></div>
  <div id="gallery-strip"></div>
</div>
<div id="lightbox">
  <button id="lightbox-close" onclick="closeLightbox()">&times;</button>
  <button class="gallery-arrow" id="lb-prev" onclick="event.stopPropagation(); galleryNav(-1); updateLightbox();">&#8249;</button>
  <img id="lightbox-img" src="">
  <div id="lightbox-meta"></div>
  <button class="gallery-arrow" id="lb-next" onclick="event.stopPropagation(); galleryNav(1); updateLightbox();">&#8250;</button>
</div>
<div id="panel">
  <h2>☀ LumiTrail</h2>
  <div id="stats" class="stats"></div>

  <div class="toggle-row">
    <div class="toggle-btn active" id="btnTracks" onclick="toggleLayer('tracks')">📍 Tracks</div>
    <div class="toggle-btn active" id="btnPhotos" onclick="toggleLayer('photos')">📷 Fotos</div>
  </div>

  <!-- Date Range Slider -->
  <div class="section date-range-section">
    <div class="section-title">Zeitraum</div>
    <div class="date-range-labels">
      <span id="dateRangeMin">–</span>
      <span id="dateRangeMax">–</span>
    </div>
    <div class="date-range-slider">
      <div class="track-bg"></div>
      <div class="track-fill" id="dateRangeFill"></div>
      <input type="range" id="dateRangeMinInput" min="0" max="100" value="0" oninput="updateDateRangeMin(this.value)">
      <input type="range" id="dateRangeMaxInput" min="0" max="100" value="100" oninput="updateDateRangeMax(this.value)">
    </div>
  </div>

  <!-- Tree View -->
  <div class="section">
    <div class="section-title">Ordner & Dateien</div>
    <div class="tree-actions">
      <button class="tree-btn" id="btnCollapseAll" onclick="collapseAllTree()">Alles zuklappen</button>
      <button class="tree-btn" id="btnExpandAll" onclick="expandAllTree()">Alles aufklappen</button>
    </div>
    <div id="treeContainer" class="tree-container"></div>
  </div>

  <div class="section">
    <div class="section-title">Eigene Tracks</div>
    <div id="customTrackList" class="custom-track-list"></div>
    <label class="toggle-btn" id="btnLoadGpx" style="display:block;">📂 GPX laden
      <input type="file" id="gpxFileInput" accept=".gpx" multiple style="display:none">
    </label>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let map, trackGroup, photoCluster, heatLayer, customTrackGroup;
let trackLayersById = {};   // id -> {layer, data, tour}
let photoMarkersById = {};  // id -> {marker, data, tour}
let customTracksById = {};  // id -> {layers, name}
let customTrackSeq = 0;
let allTours = [];
let activeTours = new Set();
let showTracks = true, showPhotos = true;
let loadTimer = null;
const DEBOUNCE_MS = 300;

// Tree state
let treeData = null;           // hierarchical tree from /api/tree
let dateRange = { min: null, max: null };  // Date objects
let dateMinTs = 0, dateMaxTs = 0;          // timestamps for slider
let visibleTrackIds = new Set();           // track IDs to show
let visiblePhotoIds = new Set();           // photo IDs to show
let expandedFolders = new Set();           // folder paths that are expanded

const TRACK_COLOR = 'rgba(50, 100, 180, 0.35)';
const TRACK_COLOR_FULL = 'rgba(50, 100, 180, 0.6)';
const CUSTOM_TRACK_COLOR = '#e91e63';

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
async function init() {
  map = L.map('map', { zoomControl: true }).setView([48.5, 9.5], 8);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 19,
    subdomains: 'abcd',
  }).addTo(map);

  trackGroup = L.layerGroup().addTo(map);
  customTrackGroup = L.layerGroup().addTo(map);
  photoCluster = L.markerClusterGroup({
    maxClusterRadius: 50,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    disableClusteringAtZoom: 16,
  }).addTo(map);

  // GPX upload works independently of the backend API
  document.getElementById('gpxFileInput').addEventListener('change', handleGpxFileSelect);

  // Load stats + tree
  try {
    const [statsResp, treeResp] = await Promise.all([
      fetch('/api/stats'), fetch('/api/tree')
    ]);
    const stats = await statsResp.json();
    treeData = await treeResp.json();

    document.getElementById('stats').textContent =
      `${stats.tracks} Tracks · ${stats.photos} Fotos · ${stats.tours} Touren`;

    // Initialize date range from tree
    initDateRange(treeData);

    // All visible initially
    collectAllVisibleIds(treeData);

    // Render tree
    renderTree();
  } catch (e) {
    document.getElementById('loading').textContent = 'Fehler: API nicht erreichbar!';
    console.error(e);
    return;
  }

  // Initial load
  await loadViewport();

  // Fit to all data on first load
  const allBounds = [];
  Object.values(trackLayersById).forEach(t => {
    allBounds.push(t.data.bounds[0], t.data.bounds[1]);
  });
  Object.values(photoMarkersById).forEach(p => {
    allBounds.push([p.data.lat, p.data.lon]);
  });
  if (allBounds.length > 0) {
    map.fitBounds(L.latLngBounds(allBounds).pad(0.05));
  }

  // Reload on viewport change
  map.on('moveend', () => {
    clearTimeout(loadTimer);
    loadTimer = setTimeout(loadViewport, DEBOUNCE_MS);
  });

  document.getElementById('loading').style.display = 'none';

  // Cluster click -> gallery
  photoCluster.on('clusterclick', function(e) {
    const childMarkers = e.layer.getAllChildMarkers();
    if (childMarkers.length > 0) {
      openGalleryNearby(childMarkers[0].getLatLng(), childMarkers);
    }
  });
}

function initDateRange(nodes) {
  let minTs = Infinity, maxTs = -Infinity;
  function walk(n) {
    if (n.date_min) {
      const ts = new Date(n.date_min).getTime();
      if (ts < minTs) minTs = ts;
    }
    if (n.date_max) {
      const ts = new Date(n.date_max).getTime();
      if (ts > maxTs) maxTs = ts;
    }
    if (n.children) n.children.forEach(walk);
    if (n.files) n.files.forEach(f => {
      if (f.date) {
        const ts = new Date(f.date).getTime();
        if (ts < minTs) minTs = ts;
        if (ts > maxTs) maxTs = ts;
      }
    });
  }
  nodes.forEach(walk);
  if (minTs !== Infinity && maxTs !== -Infinity) {
    dateMinTs = minTs;
    dateMaxTs = maxTs;
    dateRange.min = new Date(minTs);
    dateRange.max = new Date(maxTs);
    updateDateRangeDisplay();
    updateDateRangeFill();
  }
}

function collectAllVisibleIds(nodes) {
  visibleTrackIds.clear();
  visiblePhotoIds.clear();
  expandedFolders.clear();
  function walk(n, path) {
    // Expand all folders by default
    expandedFolders.add(path);
    if (n.files) {
      n.files.forEach(f => {
        if (f.type === 'track') visibleTrackIds.add(f.id);
        else visiblePhotoIds.add(f.id);
      });
    }
    if (n.children) {
      n.children.forEach(c => walk(c, c.path));
    }
  }
  nodes.forEach(n => walk(n, n.path));
}

// ---------------------------------------------------------------------------
// Tree Rendering
// ---------------------------------------------------------------------------
function renderTree() {
  const container = document.getElementById('treeContainer');
  container.innerHTML = '';
  if (!treeData) return;

  treeData.forEach(node => {
    container.appendChild(renderTreeNode(node, 0));
  });
}

function renderTreeNode(node, depth) {
  const div = document.createElement('div');
  div.className = 'tree-node';
  div.dataset.path = node.path;

  // Folder row
  const folderDiv = document.createElement('div');
  folderDiv.className = 'tree-folder' + (expandedFolders.has(node.path) ? ' open' : '');
  folderDiv.innerHTML = `
    <span class="folder-toggle" onclick="toggleFolder('${escJs(node.path)}', event)"></span>
    <input type="checkbox" class="folder-checkbox" ${visibleCount(node) > 0 ? 'checked' : ''} onchange="toggleFolderVisibility('${escJs(node.path)}', this.checked)">
    <span class="folder-icon">📁</span>
    <span class="folder-name" title="${escHtml(node.path)}" onclick="zoomToFolder('${escJs(node.path)}', event)">${escHtml(node.name)}</span>
    <span class="folder-count">${node.track_count} T / ${node.photo_count} F</span>
  `;
  div.appendChild(folderDiv);

  // Children container
  const childrenDiv = document.createElement('div');
  childrenDiv.className = 'tree-children' + (expandedFolders.has(node.path) ? '' : ' collapsed');
  childrenDiv.id = 'children-' + node.path.replace(/\//g, '-');

  // Files
  if (node.files && node.files.length > 0) {
    node.files.forEach(file => {
      childrenDiv.appendChild(renderFileEntry(file, node.path));
    });
  }

  // Subfolders
  if (node.children) {
    node.children.forEach(child => {
      childrenDiv.appendChild(renderTreeNode(child, depth + 1));
    });
  }

  div.appendChild(childrenDiv);
  return div;
}

function renderFileEntry(file, folderPath) {
  const div = document.createElement('div');
  div.className = 'tree-file';
  const dateStr = file.date ? new Date(file.date).toLocaleDateString('de-DE') : '';
  const icon = file.type === 'track' ? '📍' : '📷';
  const isTrackVisible = visibleTrackIds.has(file.id);
  const isPhotoVisible = visiblePhotoIds.has(file.id);
  const checked = (file.type === 'track' ? isTrackVisible : isPhotoVisible) ? 'checked' : '';
  div.innerHTML = `
    <input type="checkbox" class="file-checkbox" ${checked} onclick="event.stopPropagation()" onchange="toggleFileVisibility('${escJs(file.id)}', '${escJs(file.type)}', this.checked)">
    <span class="file-icon">${icon}</span>
    <span class="file-name" title="${escHtml(file.name)}" onclick="zoomToItem('${escJs(file.id)}', '${escJs(file.type)}', event)">${escHtml(file.name)}</span>
    <span class="file-date">${dateStr}</span>
  `;
  return div;
}

function visibleCount(node) {
  let count = 0;
  if (node.files) count += node.files.length;
  if (node.children) node.children.forEach(c => count += visibleCount(c));
  return count;
}

function toggleFolder(path, event) {
  event.stopPropagation();
  const childrenDiv = document.getElementById('children-' + path.replace(/\//g, '-'));
  const folderDiv = childrenDiv.previousElementSibling;
  if (expandedFolders.has(path)) {
    expandedFolders.delete(path);
    childrenDiv.classList.add('collapsed');
    folderDiv.classList.remove('open');
  } else {
    expandedFolders.add(path);
    childrenDiv.classList.remove('collapsed');
    folderDiv.classList.add('open');
  }
}

function toggleFolderVisibility(path, checked) {
  function walk(node) {
    if (node.path === path) {
      setVisibilityRecursive(node, checked);
      return true;
    }
    if (node.children) {
      for (const c of node.children) {
        if (walk(c)) return true;
      }
    }
    return false;
  }
  walk({ children: treeData, path: '' });
  // Jede Ordner-Checkbox wird aus den Sichtbarkeits-Sets neu synchronisiert,
  // damit angeklickter Ordner, alle Vorfahren UND alle Nachfahren konsistent
  // sind (kein Ordner wird übersehen).
  syncAllFolderCheckboxes();
  // Datei-Checkboxen des gesamten Unterbaums setzen
  updateChildCheckboxes(path, checked);
  loadViewport();
}

function updateAllFolderCheckboxes(changedPath) {
  // Update checkbox for the changed folder
  updateFolderCheckboxes(changedPath);
  // Also update all ancestor folders up to root
  let currentPath = changedPath;
  while (currentPath.includes('/')) {
    currentPath = currentPath.substring(0, currentPath.lastIndexOf('/'));
    updateFolderCheckboxes(currentPath);
  }
}

function setVisibilityRecursive(node, checked) {
  if (node.files) {
    node.files.forEach(f => {
      if (f.type === 'track') {
        if (checked) visibleTrackIds.add(f.id);
        else visibleTrackIds.delete(f.id);
      } else {
        if (checked) visiblePhotoIds.add(f.id);
        else visiblePhotoIds.delete(f.id);
      }
    });
  }
  if (node.children) {
    node.children.forEach(c => setVisibilityRecursive(c, checked));
  }
}

function updateFolderCheckboxes(path, node) {
  // Update checkbox state for this folder (with indeterminate support)
  const checkbox = document.querySelector(`[data-path="${escJs(path)}"] .folder-checkbox`);
  if (!checkbox) return;

  if (!node) node = findNode(treeData, path);
  if (!node) return;

  function checkVisibility(node) {
    let allVisible = true;
    let someVisible = false;

    if (node.files) {
      for (const f of node.files) {
        const isVisible = f.type === 'track' ? visibleTrackIds.has(f.id) : visiblePhotoIds.has(f.id);
        if (isVisible) someVisible = true;
        else allVisible = false;
      }
    }
    if (node.children) {
      for (const c of node.children) {
        const childResult = checkVisibility(c);
        if (childResult.all) {
          // Ein komplett sichtbarer Unterordner bedeutet: mindestens
          // ein Teil ist sichtbar -> Elternordner ist "teilweise gewählt".
          someVisible = true;
        } else if (childResult.some) {
          allVisible = false;
          someVisible = true;
        } else {
          // child none visible
          allVisible = false;
        }
      }
    }
    return { all: allVisible, some: someVisible };
  }

  function findNode(nodes, p) {
    for (const n of nodes) {
      if (n.path === p) return n;
      if (n.children) {
        const found = findNode(n.children, p);
        if (found) return found;
      }
    }
    return null;
  }

  const result = checkVisibility(node);
  checkbox.checked = result.all;
  checkbox.indeterminate = !result.all && result.some;
}

function updateChildCheckboxes(path, checked) {
  // Update all descendant file checkboxes in the DOM
  const container = document.getElementById('children-' + path.replace(/\//g, '-'));
  if (container) {
    container.querySelectorAll('.file-checkbox').forEach(cb => {
      cb.checked = checked;
    });
  }
}

function syncAllFolderCheckboxes() {
  // Recompute checkbox state (checked/indeterminate) for EVERY folder from
  // the current visibility sets. O(n) - called after each toggle so no
  // folder (Vorfahr, Nachfahre oder angeklickter Ordner) übersehen wird.
  function walk(nodes) {
    for (const n of nodes) {
      updateFolderCheckboxes(n.path, n);
      if (n.children) walk(n.children);
    }
  }
  walk(treeData);
}

function toggleFileVisibility(id, type, checked) {
  if (type === 'track') {
    if (checked) visibleTrackIds.add(id);
    else visibleTrackIds.delete(id);
  } else {
    if (checked) visiblePhotoIds.add(id);
    else visiblePhotoIds.delete(id);
  }
  // Update ancestor folder checkboxes
  const path = findFilePathInTree(treeData, id);
  if (path) {
    updateAllFolderCheckboxes(path);
  }
  loadViewport();
}

function findFilePathInTree(nodes, fileId) {
  for (const n of nodes) {
    if (n.files && n.files.some(f => f.id === fileId)) {
      return n.path;
    }
    if (n.children) {
      const found = findFilePathInTree(n.children, fileId);
      if (found) return found;
    }
  }
  return null;
}

function collapseAllTree() {
  expandedFolders.clear();
  document.querySelectorAll('.tree-folder').forEach(f => f.classList.remove('open'));
  document.querySelectorAll('.tree-children').forEach(c => c.classList.add('collapsed'));
}

function expandAllTree() {
  function addAll(nodes) {
    nodes.forEach(n => {
      expandedFolders.add(n.path);
      if (n.children) addAll(n.children);
    });
  }
  addAll(treeData);
  document.querySelectorAll('.tree-folder').forEach(f => f.classList.add('open'));
  document.querySelectorAll('.tree-children').forEach(c => c.classList.remove('collapsed'));
}

// ---------------------------------------------------------------------------
// Zoom to item / folder from tree clicks
// ---------------------------------------------------------------------------
function zoomToItem(id, type, event) {
  event.stopPropagation();
  if (type === 'photo') {
    // Find photo marker and open gallery + zoom
    const entry = photoMarkersById[id];
    if (entry) {
      openGalleryAt(entry.marker);
      map.setView([entry.data.lat, entry.data.lon], 16);
    } else {
      // Photo not in viewport - fetch from tree data and load
      loadPhotoAndZoom(id);
    }
  } else if (type === 'track') {
    // Find track layer and zoom to bounds
    const entry = trackLayersById[id];
    if (entry) {
      map.fitBounds(entry.layer.getBounds().pad(0.1));
    } else {
      // Track not in viewport - load and zoom
      loadTrackAndZoom(id);
    }
  }
}

async function loadPhotoAndZoom(photoId) {
  try {
    // Find photo in tree data first
    const photoInfo = findPhotoInTree(treeData, photoId);
    if (!photoInfo) return;

    // Fetch photo data directly from API (no viewport filter)
    const resp = await fetch(`/api/photos?south=-90&north=90&west=-180&east=180`);
    const photos = await resp.json();
    const photoData = photos.find(p => p.id === photoId);
    if (!photoData) return;

    // Ensure photo is visible
    visiblePhotoIds.add(photoId);
    await loadViewport();

    // Try to open gallery with the marker
    const entry = photoMarkersById[photoId];
    if (entry) {
      openGalleryAt(entry.marker);
      map.setView([entry.data.lat, entry.data.lon], 16);
    } else {
      // Fallback: create temporary marker and open gallery
      const icon = L.divIcon({
        className: 'photo-marker',
        html: `<div style="width:36px;height:36px;border-radius:4px;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4);background:url('${photoData.thumb}') center/cover;"></div>`,
        iconSize: [36, 36], iconAnchor: [18, 18],
      });
      const tempMarker = L.marker([photoData.lat, photoData.lon], { icon });
      tempMarker._photoId = photoId;
      tempMarker.addTo(map);
      tempMarker.on('click', () => openGalleryAt(tempMarker));
      openGalleryAt(tempMarker);
      map.setView([photoData.lat, photoData.lon], 16);
      setTimeout(() => map.removeLayer(tempMarker), 3000);
    }
  } catch (e) {
    console.error('Failed to load photo:', e);
  }
}

async function loadTrackAndZoom(trackId) {
  try {
    // Fetch single track directly from API (no viewport filter)
    const resp = await fetch(`/api/track/${trackId}`);
    const points = await resp.json();
    const latlngs = points.map(p => [p[0], p[1]]);

    // Ensure track is visible
    visibleTrackIds.add(trackId);
    await loadViewport();

    // Zoom to track bounds
    const entry = trackLayersById[trackId];
    if (entry) {
      map.fitBounds(entry.layer.getBounds().pad(0.1));
    } else if (latlngs.length > 0) {
      // Fallback: create temporary polyline and zoom
      const tempLine = L.polyline(latlngs, { color: TRACK_COLOR, weight: 3, opacity: 0.5 });
      tempLine.addTo(map);
      map.fitBounds(tempLine.getBounds().pad(0.1));
      setTimeout(() => map.removeLayer(tempLine), 2000);
    }
  } catch (e) {
    console.error('Failed to load track:', e);
  }
}

function findPhotoInTree(nodes, photoId) {
  for (const n of nodes) {
    if (n.files) {
      const found = n.files.find(f => f.id === photoId && f.type === 'photo');
      if (found) return found;
    }
    if (n.children) {
      const found = findPhotoInTree(n.children, photoId);
      if (found) return found;
    }
  }
  return null;
}

function zoomToFolder(path, event) {
  event.stopPropagation();
  // Find all items in this folder path
  const bounds = [];

  // Find tracks in this folder path
  Object.values(trackLayersById).forEach(entry => {
    if (entry.data.tour && (entry.data.tour.startsWith(path + '/') || entry.data.tour === path)) {
      bounds.push(entry.layer.getBounds());
    }
  });

  // Find photos in this folder path
  Object.values(photoMarkersById).forEach(entry => {
    if (entry.data.tour && (entry.data.tour.startsWith(path + '/') || entry.data.tour === path)) {
      bounds.push(L.latLngBounds([entry.data.lat, entry.data.lon]));
    }
  });

  if (bounds.length > 0) {
    const combined = bounds.reduce((acc, b) => acc.extend(b), L.latLngBounds(bounds[0]));
    map.fitBounds(combined.pad(0.1));
  } else {
    // No items in viewport - fetch from API
    fetchFolderBoundsFromAPI(path).then(apiBounds => {
      if (apiBounds.length > 0) {
        const combined = apiBounds.reduce((acc, b) => acc.extend(b), L.latLngBounds(apiBounds[0]));
        map.fitBounds(combined.pad(0.1));
      }
    });
  }
}

async function fetchFolderBoundsFromAPI(folderPath) {
  try {
    // Fetch all tracks and photos for this folder
    const [tracksResp, photosResp] = await Promise.all([
      fetch(`/api/tracks?south=-90&north=90&west=-180&east=180`),
      fetch(`/api/photos?south=-90&north=90&west=-180&east=180`)
    ]);
    const [tracks, photos] = await Promise.all([tracksResp.json(), photosResp.json()]);

    const bounds = [];
    tracks.forEach(t => {
      if (t.tour && (t.tour.startsWith(folderPath + '/') || t.tour === folderPath)) {
        bounds.push(L.latLngBounds(t.bounds[0], t.bounds[1]));
      }
    });
    photos.forEach(p => {
      if (p.tour && (p.tour.startsWith(folderPath + '/') || p.tour === folderPath)) {
        bounds.push(L.latLngBounds([p.lat, p.lon]));
      }
    });
    return bounds;
  } catch (e) {
    console.error('Failed to fetch folder bounds:', e);
    return [];
  }
}

// ---------------------------------------------------------------------------
// Date Range Slider
// ---------------------------------------------------------------------------
function updateDateRangeMin(val) {
  const pct = parseInt(val);
  const ts = dateMinTs + (dateMaxTs - dateMinTs) * (pct / 100);
  dateRange.min = new Date(ts);
  // Ensure min <= max
  if (dateRange.min > dateRange.max) dateRange.min = new Date(dateRange.max);
  updateDateRangeDisplay();
  updateDateRangeFill();
  loadViewport();
}

function updateDateRangeMax(val) {
  const pct = parseInt(val);
  const ts = dateMinTs + (dateMaxTs - dateMinTs) * (pct / 100);
  dateRange.max = new Date(ts);
  // Ensure max >= min
  if (dateRange.max < dateRange.min) dateRange.max = new Date(dateRange.min);
  updateDateRangeDisplay();
  updateDateRangeFill();
  loadViewport();
}

function updateDateRangeDisplay() {
  const minEl = document.getElementById('dateRangeMin');
  const maxEl = document.getElementById('dateRangeMax');
  if (dateRange.min) minEl.textContent = dateRange.min.toLocaleDateString('de-DE');
  if (dateRange.max) maxEl.textContent = dateRange.max.toLocaleDateString('de-DE');
}

function updateDateRangeFill() {
  const fill = document.getElementById('dateRangeFill');
  const minInput = document.getElementById('dateRangeMinInput');
  const maxInput = document.getElementById('dateRangeMaxInput');
  if (dateMinTs === dateMaxTs) {
    minInput.value = 0;
    maxInput.value = 100;
    fill.style.left = '0%';
    fill.style.width = '100%';
    return;
  }
  const minPct = ((dateRange.min.getTime() - dateMinTs) / (dateMaxTs - dateMinTs)) * 100;
  const maxPct = ((dateRange.max.getTime() - dateMinTs) / (dateMaxTs - dateMinTs)) * 100;
  minInput.value = Math.round(minPct);
  maxInput.value = Math.round(maxPct);
  fill.style.left = minPct + '%';
  fill.style.width = (maxPct - minPct) + '%';
}

// ---------------------------------------------------------------------------
// Lazy load viewport data
// ---------------------------------------------------------------------------
let viewportLoadToken = 0;
async function loadViewport() {
  // Nur der jeweils letzte Aufruf darf den Karten-Zustand verändern.
  // Überlappende Aufrufe (z.B. moveend + direkte Aufrufe) könnten sonst
  // Layer zeitversetzt entfernen/hinzufügen und die Karte "einfrieren".
  const myToken = ++viewportLoadToken;

  let b, params, tracksResp, photosResp;
  try {
  b = map.getBounds();
  params = new URLSearchParams({
    south: b.getSouth(), north: b.getNorth(),
    west: b.getWest(), east: b.getEast(),
  });
  // Date range params
  if (dateRange.min) params.set('date_min', dateRange.min.toISOString().split('T')[0]);
  if (dateRange.max) params.set('date_max', dateRange.max.toISOString().split('T')[0]);

  const [tr, pr] = await Promise.all([
    showTracks ? fetch(`/api/tracks?${params}`) : Promise.resolve(null),
    showPhotos ? fetch(`/api/photos?${params}`) : Promise.resolve(null),
  ]);
  tracksResp = tr;
  photosResp = pr;
  } catch (e) {
    console.error('loadViewport fetch failed:', e);
    return;
  }

  // Ein neuerer Load hat begonnen - Ergebnisse verwerfen.
  if (myToken !== viewportLoadToken) return;

  // --- Tracks ---
  if (tracksResp) {
    const tracks = await tracksResp.json();
    const newIds = new Set(tracks.map(t => t.id));

    // Remove tracks no longer in viewport
    for (const id of Object.keys(trackLayersById)) {
      if (!newIds.has(id)) {
        trackGroup.removeLayer(trackLayersById[id].layer);
        delete trackLayersById[id];
      }
    }

    // Add new tracks (filter by visibleTrackIds)
    const heatPoints = [];
    tracks.forEach(track => {
      if (!visibleTrackIds.has(track.id)) return; // filtered out by tree
      const latlngs = track.overview.map(p => [p[0], p[1]]);
      latlngs.forEach(ll => heatPoints.push([ll[0], ll[1], 0.4]));

      if (trackLayersById[track.id]) return; // already displayed

      const line = L.polyline(latlngs, {
        color: TRACK_COLOR, weight: 3, opacity: 1,
        lineCap: 'round', lineJoin: 'round',
      });

      const dateStr = track.date ? new Date(track.date).toLocaleDateString('de-DE') : '';
      const folderPath = track.folder || '';
      line.bindPopup(`
        <div class="track-popup">
          <div class="name">${escHtml(track.name)}</div>
          <div class="meta">
            ${dateStr ? '📃 ' + dateStr + '<br>' : ''}
            📊 ${track.point_count} Punkte<br>
            📁 ${escHtml(track.tour)}<br>
            <a href="#" onclick="loadFullTrack('${track.id}'); return false;">
              🔍 Volle AuflÃ¶sung laden
            </a>
            ${folderPath ? '<br><a href="#" class="copy-path" data-path="' + escHtml(folderPath) + '" onclick="copyPath(this.dataset.path, this); return false;">📋 Pfad kopieren</a>' : ''}
          </div>
        </div>
      `);

      line.addTo(trackGroup);
      trackLayersById[track.id] = { layer: line, data: track, tour: track.tour };
    });

    // Update heatmap
    if (heatLayer) map.removeLayer(heatLayer);
    if (heatPoints.length > 0) {
      heatLayer = L.heatLayer(heatPoints, {
        radius: 12, blur: 15, maxZoom: 14, max: 1.0,
        gradient: {
          0.0: '#d0d8ff', 0.3: '#4a7dcc', 0.5: '#2255aa',
          0.7: '#cc6622', 0.85: '#dd3311', 1.0: '#ff0000'
        }
      }).addTo(map);
    }
  } else {
    // Tracks hidden
    for (const id of Object.keys(trackLayersById)) {
      trackGroup.removeLayer(trackLayersById[id].layer);
    }
    trackLayersById = {};
    if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
  }

  // --- Photos ---
  if (photosResp) {
    const photos = await photosResp.json();
    const newIds = new Set(photos.map(p => p.id));

    // Remove photos no longer in viewport
    for (const id of Object.keys(photoMarkersById)) {
      if (!newIds.has(id)) {
        photoCluster.removeLayer(photoMarkersById[id].marker);
        delete photoMarkersById[id];
      }
    }

    // Add new photos (filter by visiblePhotoIds)
    photos.forEach(photo => {
      if (!visiblePhotoIds.has(photo.id)) return; // filtered out by tree
      if (photoMarkersById[photo.id]) return;

      const icon = L.divIcon({
        className: 'photo-marker',
        html: `<div style="width:36px;height:36px;border-radius:4px;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4);background:url('${photo.thumb}') center/cover;"></div>`,
        iconSize: [36, 36], iconAnchor: [18, 18],
      });

      const marker = L.marker([photo.lat, photo.lon], { icon });
      marker._photoId = photo.id;
      marker.on('click', () => openGalleryAt(marker));

      photoCluster.addLayer(marker);
      photoMarkersById[photo.id] = { marker, data: photo, tour: photo.tour };
    });
  } else {
    // Photos hidden
    photoCluster.clearLayers();
    photoMarkersById = {};
  }
}

async function loadFullTrack(trackId) {
  try {
    const resp = await fetch(`/api/track/${trackId}`);
    const points = await resp.json();
    const latlngs = points.map(p => [p[0], p[1]]);

    const entry = trackLayersById[trackId];
    if (entry) {
      trackGroup.removeLayer(entry.layer);
      const fullLine = L.polyline(latlngs, {
        color: TRACK_COLOR_FULL, weight: 3, opacity: 1,
        lineCap: 'round', lineJoin: 'round',
      });
      fullLine.bindPopup(entry.layer.getPopup());
      fullLine.addTo(trackGroup);
      entry.layer = fullLine;
      map.fitBounds(fullLine.getBounds().pad(0.05));
    }
  } catch (e) {
    console.error('Could not load full track:', e);
  }
}

// ---------------------------------------------------------------------------
// GPX Upload
// ---------------------------------------------------------------------------
function handleGpxFileSelect(e) {
  const files = [...e.target.files];
  e.target.value = ''; // erlaubt erneutes Laden derselben Datei(en)
  if (files.length === 0) return;

  Promise.all(files.map(readGpxFile)).then(added => {
    const entries = added.filter(Boolean);
    if (entries.length === 0) return;
    const allLayers = entries.flatMap(entry => entry.layers);
    map.fitBounds(L.featureGroup(allLayers).getBounds().pad(0.05));
    renderCustomTrackList();
  });
}

function readGpxFile(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(parseGpxFile(reader.result, file.name));
    reader.onerror = () => {
      alert(`GPX-Datei "${file.name}" konnte nicht gelesen werden.`);
      resolve(null);
    };
    reader.readAsText(file);
  });
}

function parseGpxFile(xmlText, filename) {
  const xml = new DOMParser().parseFromString(xmlText, 'application/xml');
  if (xml.querySelector('parsererror')) {
    alert(`UngÃ¼ltige GPX-Datei: ${filename}`);
    return null;
  }

  // Segmente sammeln: bevorzugt trk/trkseg/trkpt, sonst rte/rtept als Fallback
  const segments = [];
  xml.querySelectorAll('trk').forEach(trk => {
    trk.querySelectorAll('trkseg').forEach(seg => {
      const pts = [...seg.querySelectorAll('trkpt')]
        .map(p => [parseFloat(p.getAttribute('lat')), parseFloat(p.getAttribute('lon'))])
        .filter(p => !isNaN(p[0]) && !isNaN(p[1]));
      if (pts.length > 1) segments.push(pts);
    });
  });
  if (segments.length === 0) {
    xml.querySelectorAll('rte').forEach(rte => {
      const pts = [...rte.querySelectorAll('rtept')]
        .map(p => [parseFloat(p.getAttribute('lat')), parseFloat(p.getAttribute('lon'))])
        .filter(p => !isNaN(p[0]) && !isNaN(p[1]));
      if (pts.length > 1) segments.push(pts);
    });
  }
  if (segments.length === 0) {
    alert(`Keine Track-Punkte gefunden in: ${filename}`);
    return null;
  }

  const nameEl = xml.querySelector('trk > name, metadata > name');
  const name = (nameEl && nameEl.textContent.trim()) || filename;

  const id = 'custom-' + (++customTrackSeq);
  const layers = segments.map(pts => L.polyline(pts, {
    color: CUSTOM_TRACK_COLOR, weight: 5, opacity: 0.9,
    lineCap: 'round', lineJoin: 'round',
  }).addTo(customTrackGroup));
  layers.forEach(l => l.bindPopup(`<div class="track-popup"><div class="name">${escHtml(name)}</div></div>`));

  const entry = { layers, name };
  customTracksById[id] = entry;
  return entry;
}

function zoomToCustomTrack(id) {
  const entry = customTracksById[id];
  if (!entry) return;
  map.fitBounds(L.featureGroup(entry.layers).getBounds().pad(0.05));
}

function removeCustomTrack(id) {
  const entry = customTracksById[id];
  if (!entry) return;
  entry.layers.forEach(l => customTrackGroup.removeLayer(l));
  delete customTracksById[id];
  renderCustomTrackList();
}

function renderCustomTrackList() {
  const list = document.getElementById('customTrackList');
  list.innerHTML = '';
  Object.entries(customTracksById).forEach(([id, entry]) => {
    const row = document.createElement('div');
    row.className = 'custom-track-item';
    row.innerHTML = `<span class="name">${escHtml(entry.name)}</span>
      <span class="remove-btn" title="Entfernen">✕</span>`;
    row.onclick = () => zoomToCustomTrack(id);
    row.querySelector('.remove-btn').onclick = (e) => {
      e.stopPropagation();
      removeCustomTrack(id);
    };
    list.appendChild(row);
  });
}

// ---------------------------------------------------------------------------
// Util
// ---------------------------------------------------------------------------
function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

function escJs(s) {
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
}

function copyPath(path, el) {
  navigator.clipboard.writeText(path).then(() => {
    const span = document.createElement('span');
    span.className = 'copy-ok';
    span.textContent = ' ✓" kopiert';
    el.parentNode.insertBefore(span, el.nextSibling);
    setTimeout(() => span.remove(), 1500);
  });
}

// ---------------------------------------------------------------------------
// Gallery
// ---------------------------------------------------------------------------
let galleryPhotos = [];
let galleryIdx = 0;

function openGalleryAt(marker) {
  const latlng = marker.getLatLng();
  openGalleryNearby(latlng);
}

function openGalleryNearby(latlng, clusterMarkers) {
  const NEARBY_RADIUS = 300;
  let nearby;
  const allPhotos = Object.values(photoMarkersById);

  if (clusterMarkers) {
    const idSet = new Set(clusterMarkers.map(m => m._photoId));
    nearby = allPhotos.filter(p => idSet.has(p.data.id)).map(p => p.data);
    if (nearby.length === 0) {
      nearby = allPhotos
        .filter(p => latlng.distanceTo(L.latLng(p.data.lat, p.data.lon)) < NEARBY_RADIUS)
        .map(p => p.data);
    }
  } else {
    // Einzelnes Foto: alle sichtbaren Fotos einbeziehen, damit in der
    // Galerie vor/zurück geblättert werden kann (nicht nur die im 300-m-Umkreis).
    nearby = allPhotos
      .filter(p => visiblePhotoIds.has(p.data.id))
      .map(p => p.data);
  }

  nearby.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  if (nearby.length === 0) return;

  galleryPhotos = nearby;
  galleryIdx = 0;

  let minDist = Infinity;
  nearby.forEach((p, i) => {
    const d = latlng.distanceTo(L.latLng(p.lat, p.lon));
    if (d < minDist) { minDist = d; galleryIdx = i; }
  });

  renderGallery();
  document.getElementById('gallery').style.display = 'block';
}

function renderGallery() {
  const photo = galleryPhotos[galleryIdx];
  document.getElementById('gallery-img').src = photo.thumb;
  const dateStr = photo.date ? new Date(photo.date).toLocaleDateString('de-DE') : '';
  document.getElementById('gallery-meta').innerHTML =
    `📷 ${escHtml(photo.filename)}${dateStr ? ' · ' + dateStr : ''} · ${escHtml(photo.tour)} · ${galleryIdx + 1}/${galleryPhotos.length}`;

  document.getElementById('gallery-prev').disabled = galleryIdx === 0;
  document.getElementById('gallery-next').disabled = galleryIdx === galleryPhotos.length - 1;

  const strip = document.getElementById('gallery-strip');
  strip.innerHTML = '';
  galleryPhotos.forEach((p, i) => {
    const img = document.createElement('img');
    img.src = p.thumb;
    img.className = i === galleryIdx ? 'active' : '';
    img.onclick = () => { galleryIdx = i; renderGallery(); };
    strip.appendChild(img);
  });
  setTimeout(() => {
    const active = strip.querySelector('.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }, 50);
}

function galleryNav(dir) {
  galleryIdx = Math.max(0, Math.min(galleryPhotos.length - 1, galleryIdx + dir));
  renderGallery();
}

function closeGallery() {
  document.getElementById('gallery').style.display = 'none';
  closeLightbox();
}

// Lightbox
function openLightbox() {
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.activeElement?.blur();
}

function updateLightbox() {
  const photo = galleryPhotos[galleryIdx];
  document.getElementById('lightbox-img').src = `/original/${photo.id}.jpg`;
  const dateStr = photo.date ? new Date(photo.date).toLocaleDateString('de-DE') : '';
  document.getElementById('lightbox-meta').innerHTML =
    `📷 ${escHtml(photo.filename)}${dateStr ? ' · ' + dateStr : ''} · ${escHtml(photo.tour)} · ${galleryIdx + 1}/${galleryPhotos.length}`;
  document.getElementById('lb-prev').disabled = galleryIdx === 0;
  document.getElementById('lb-next').disabled = galleryIdx === galleryPhotos.length - 1;
  renderGallery();
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') closeLightbox();
});

document.getElementById('gallery-img').addEventListener('click', () => openLightbox());

document.getElementById('lightbox-img').addEventListener('click', closeLightbox);

document.addEventListener('keydown', (e) => {
  const galleryOpen = document.getElementById('gallery').style.display === 'block';
  const lightboxOpen = document.getElementById('lightbox').classList.contains('open');
  if (!galleryOpen && !lightboxOpen) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); galleryNav(-1); if (lightboxOpen) updateLightbox(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); galleryNav(1); if (lightboxOpen) updateLightbox(); }
  else if (e.key === 'Escape') { e.preventDefault(); if (lightboxOpen) closeLightbox(); else closeGallery(); }
});

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
init();
</script>
</body>
</html>
