services:
  lumitrail:
    build: .
    image: lumitrail:latest
    container_name: lumitrail
    restart: unless-stopped
    ports:
      - "2500:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - VERBOSE=1   # loggt jeden Request inkl. Dauer, hilfreich fuer haengende/langsame Requests
    volumes:
      - /volume1/photos:/data:ro        # adjust to your photo/GPX directory
      - lumitrail_output:/output
    command: ["/data", "-o", "/output", "--watch", "--no-browser"]

volumes:
  lumitrail_output:
